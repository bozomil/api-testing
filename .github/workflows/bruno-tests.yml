name: Pokreni Bruno kolekciju

on:
  workflow_dispatch: # Omogućuje ručno pokretanje klikom na gumb na GitHubu
  #push:
  #  branches: [ main ]
  #schedule:
  #  - cron: '0 7 * * *' # Svaki dan u 07:00 UTC (08:00 CET u Hrvatskoj)    

permissions:
  id-token: write # Obavezno za OIDC prijavu na Infisical
  contents: read

jobs:
  run-bruno:
    runs-on: self-hosted

    steps:
      - name: Preuzmi kod iz repozitorija
        uses: actions/checkout@v4

      - name: Dohvati Groq API ključ s Infisical EU
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "6a39fea7-0ba5-411f-8a62-79145a274b14"
          project-slug: "groq-api-kx8f"
          env-slug: "dev" # Ili "prod", ovisno u kojem okruženju je ključ
          domain: "https://eu.infisical.com"

      - name: Provjeri i instaliraj Bruno CLI samo ako nedostaje
        run: |
          if ! command -v bru &> /dev/null; then
            npm install -g @usebruno/cli
          fi

      - name: Pokreni Bruno kolekciju
        run: |
          cd Groq_API
          bru run --env "GROQ_API" --sandbox=developer --env-var "GROQ_API_KEY=$GROQ_API_KEY"
