info:
  name: Chat_Completion
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/openai/v1/chat/completions"
  body:
    type: json
    data: |
      {
        "model": "openai/gpt-oss-20b",
        "messages": [
          {
            "role": "system",
            "content": "Odgovaraj precizno i na hrvatskom jeziku."
          },
          {
            "role": "user",
            "content": "Objasni razliku između TCP i UDP protokola u 3 rečenice."
          }
        ],
        "temperature": 0.7
      }
  auth:
    type: bearer
    token: "{{GROQ_API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
